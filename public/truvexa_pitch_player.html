<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRUVEXA AI — 120-Second Pitch Video</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-[#040D1A] text-white font-sans p-3 md:p-6 antialiased flex flex-col items-center justify-center min-h-screen">

  <div class="w-full max-w-4xl bg-[#071426] border border-cyan-500/40 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
    <!-- Header -->
    <div class="px-5 py-3.5 bg-[#0B1F38] border-b border-cyan-900/60 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-cyan-950 border border-cyan-500/50 flex items-center justify-center text-[#00D4FF] font-bold">
          ▲
        </div>
        <div>
          <h1 class="text-sm font-extrabold tracking-wider text-white">
            TRUVEXA <span class="text-[#00D4FF]">AI</span> · 120-Second Master Pitch Video
          </h1>
          <p class="text-[11px] text-cyan-300/70 font-mono">120s Formula: 0:30 Problem · 0:45 Demo · 0:30 Tech Stack · 0:15 Impact</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a href="http://localhost:3000/TRUVEXA_AI_120s_Pitch.mp4" download="TRUVEXA_AI_120s_Pitch.mp4" class="px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-blue-600 to-[#00D4FF] text-[#071426] text-xs font-bold hover:opacity-95 transition-all shadow flex items-center gap-1.5">
          <span>📥</span>
          <span>Download MP4</span>
        </a>
      </div>
    </div>

    <!-- Video Player Stage -->
    <div class="relative w-full aspect-video bg-black flex items-center justify-center overflow-hidden">
      <video id="pitchVideo" controls autoplay class="w-full h-full object-contain">
        <source src="http://localhost:3000/TRUVEXA_AI_120s_Pitch.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <!-- 120-Second Pitch Formula Timeline Breakdown -->
    <div class="p-4 bg-[#0B1F38] border-t border-cyan-900/60 space-y-3 text-xs">
      <div class="font-bold text-cyan-300 font-mono uppercase tracking-wider">
        Pitch Formula Navigation:
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-[11px] font-mono">
        <button onclick="seekVideo(0)" class="p-2 rounded-lg bg-[#071426] border border-cyan-900/70 hover:border-cyan-400 text-left transition-colors">
          <div class="font-bold text-amber-400">0:00 - 0:30 (30s)</div>
          <div class="text-white">1. Problem & Audience</div>
          <div class="text-slate-400 text-[10px]">Logo & Discrepancies</div>
        </button>

        <button onclick="seekVideo(30)" class="p-2 rounded-lg bg-[#071426] border border-cyan-900/70 hover:border-cyan-400 text-left transition-colors">
          <div class="font-bold text-emerald-400">0:30 - 1:15 (45s)</div>
          <div class="text-white">2. Live Product Demo</div>
          <div class="text-slate-400 text-[10px]">Contradictions & Jump</div>
        </button>

        <button onclick="seekVideo(75)" class="p-2 rounded-lg bg-[#071426] border border-cyan-900/70 hover:border-cyan-400 text-left transition-colors">
          <div class="font-bold text-cyan-400">1:15 - 1:45 (30s)</div>
          <div class="text-white">3. AI & Tech Stack</div>
          <div class="text-slate-400 text-[10px]">Next 16, pgvector, Tests</div>
        </button>

        <button onclick="seekVideo(105)" class="p-2 rounded-lg bg-[#071426] border border-cyan-900/70 hover:border-cyan-400 text-left transition-colors">
          <div class="font-bold text-rose-400">1:45 - 2:00 (15s)</div>
          <div class="text-white">4. Impact & Conclusion</div>
          <div class="text-slate-400 text-[10px]">Reports & Production</div>
        </button>
      </div>

      <div class="pt-2 border-t border-cyan-900/40 flex items-center justify-between text-slate-400 text-[11px]">
        <span>File saved to: <code class="text-cyan-300">D:\OneDrive\Desktop\TRUVEXA_AI_120s_Pitch.mp4</code></span>
        <span>Resolution: 1080p Full HD (1920x1080)</span>
      </div>
    </div>
  </div>

  <script>
    function seekVideo(time) {
      const vid = document.getElementById('pitchVideo');
      if (vid) {
        vid.currentTime = time;
        vid.play();
      }
    }
  </script>
</body>
</html>
